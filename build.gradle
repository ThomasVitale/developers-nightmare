import org.cyclonedx.Version
import org.cyclonedx.gradle.BaseCyclonedxTask
import org.cyclonedx.gradle.CyclonedxDirectTask

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '1.1.18'
    id 'org.cyclonedx.bom' version '3.6.1'
}

group = 'com.thomasvitale'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
	mavenCentral()
}

ext {
    set('arconiaVersion', "0.32.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    implementation 'io.arconia:arconia-opentelemetry-spring-boot-starter'
    implementation 'io.arconia:arconia-opentelemetry-semantic-conventions'
    implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot'

    implementation 'org.webjars:webjars-locator-lite'
    implementation 'org.webjars.npm:qrcode-generator:2.0.4'

    developmentOnly "org.springframework.boot:spring-boot-devtools"

    testAndDevelopmentOnly "io.arconia:arconia-dev-services-lgtm"
    testAndDevelopmentOnly "io.arconia:arconia-dev-services-postgresql"

    testImplementation "org.springframework.boot:spring-boot-starter-actuator-test"
    testImplementation "org.springframework.boot:spring-boot-starter-data-jdbc-test"
    testImplementation "org.springframework.boot:spring-boot-starter-flyway-test"
    testImplementation "org.springframework.boot:spring-boot-starter-thymeleaf-test"
    testImplementation "org.springframework.boot:spring-boot-starter-validation-test"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "io.arconia:arconia-bom:${arconiaVersion}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-parameters")
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootBuildImage') {
    builder = "docker.io/paketobuildpacks/ubuntu-resolute-builder"
    runImage = "docker.io/paketobuildpacks/ubuntu-resolute-run-tiny"
    environment.put("BP_NATIVE_IMAGE_BUILD_ARGUMENTS", graalvmNative.binaries.main.buildArgs.map { it.join(" ") })
}

graalvmNative {
    binaries {
        main {
            buildArgs.add("--enable-monitoring=jfr")
        }
    }
}

tasks.withType(BaseCyclonedxTask).configureEach {
    schemaVersion = Version.VERSION_17

}
