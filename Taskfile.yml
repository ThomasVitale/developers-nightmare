# https://taskfile.dev

version: '3'

vars:
  REGISTRY: ghcr.io
  IMAGE: thomasvitale/developers-nightmare
  VERSION: '{{.VERSION | default "latest"}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Compile and test the application
    cmds:
      - ./gradlew build

  test:
    desc: Run the tests
    cmds:
      - ./gradlew test

  run:
    desc: Run the application locally
    cmds:
      - ./gradlew bootRun

  clean:
    desc: Delete the build outputs
    cmds:
      - ./gradlew clean

  image:build:arch:
    desc: Build and publish the OCI image for a single architecture (ARCH=amd64|arm64)
    requires:
      vars:
        - name: ARCH
          enum: [amd64, arm64]
    cmds:
      - ./gradlew bootBuildImage --imageName {{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}}-{{.ARCH}} --imagePlatform linux/{{.ARCH}}
      - docker push {{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}}-{{.ARCH}}

  image:build:
    desc: Build and publish the multi-arch OCI image (requires amd64 and arm64 images to be published first)
    cmds:
      - docker buildx imagetools create
          --tag {{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}}
          {{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}}-amd64
          {{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}}-arm64

  image:digest:
    desc: Print the digest of the published OCI image (multi-arch index, or a single architecture with ARCH=amd64|arm64)
    silent: true
    cmds:
      - skopeo inspect docker://{{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}}{{if .ARCH}}-{{.ARCH}}{{end}} | jq -r '.Digest'

  image:sign:
    desc: Sign the OCI image with Cosign
    vars:
      IMAGE_DIGEST:
        sh: '{{.TASK_EXE}} image:digest VERSION={{.VERSION}}'
    cmds:
      - echo "Signing image{{":"}} {{.REGISTRY}}/{{.IMAGE}}@{{.IMAGE_DIGEST}}"
      - cosign sign --yes {{.REGISTRY}}/{{.IMAGE}}@{{.IMAGE_DIGEST}}

  image:sbom:
    desc: Generate a CycloneDX SBOM with Syft for the published OCI image of a single architecture (ARCH=amd64|arm64)
    requires:
      vars:
        - name: ARCH
          enum: [amd64, arm64]
    vars:
      IMAGE_DIGEST:
        sh: '{{.TASK_EXE}} image:digest ARCH={{.ARCH}} VERSION={{.VERSION}}'
    cmds:
      - mkdir -p build/reports/syft
      - syft scan registry:{{.REGISTRY}}/{{.IMAGE}}@{{.IMAGE_DIGEST}}
          --source-name {{.REGISTRY}}/{{.IMAGE}}
          --source-version {{.VERSION}}
          -o cyclonedx-json=build/reports/syft/image-{{.ARCH}}.cdx.json
