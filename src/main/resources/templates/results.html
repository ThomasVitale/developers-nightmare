<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e0f2fe">
    <title>The Developer's Nightmare — Results</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦆</text></svg>">
    <link rel="preload" th:href="@{/fonts/fredoka-latin-wght-normal.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/qrcode-generator/dist/qrcode.js}"></script>
</head>
<body class="race-page">

    <div class="race-wrap">

        <header class="brand">
            <span class="duck right" aria-hidden="true">🦆</span>
            <h1>The Developer's Nightmare</h1>
        </header>

        <aside class="join">
            <p>Scan to vote!</p>
            <div id="qr" class="qr"></div>
            <a id="vote-link" th:href="@{/}">this address</a>
        </aside>

        <div class="race-question">
            <h2>What are your main friction points delivering a feature to production?</h2>
            <p id="total" class="tally-total"><strong>0</strong> votes so far</p>
        </div>

        <ol id="race" class="race" aria-live="polite"></ol>

    </div>

    <script>
        const raceEl = document.getElementById('race');
        const totalEl = document.getElementById('total');
        const lanes = new Map();
        let lastTotal = null;

        const voteUrl = location.origin + '/';
        document.getElementById('vote-link').textContent = location.host;
        const qr = qrcode(0, 'M');
        qr.addData(voteUrl);
        qr.make();
        document.getElementById('qr').innerHTML = qr.createSvgTag({
            cellSize: 1,
            margin: 0,
            scalable: true,
            alt: 'QR code to vote at ' + voteUrl
        });

        function laneFor(item) {
            let lane = lanes.get(item.id);
            if (!lane) {
                const li = document.createElement('li');
                li.className = 'lane-row';
                li.innerHTML =
                    '<span class="label"></span>' +
                    '<div class="lane"><div class="trail"></div>' +
                    '<div class="swimmer"><span class="duck right" aria-hidden="true">🦆</span><span class="count"></span></div></div>';
                li.querySelector('.label').textContent = item.label;
                raceEl.append(li);
                lane = {
                    li,
                    track: li.querySelector('.lane'),
                    swimmer: li.querySelector('.swimmer'),
                    count: li.querySelector('.count'),
                    last: null
                };
                lanes.set(item.id, lane);
            }
            return lane;
        }

        function celebrate(lane, gained) {
            lane.swimmer.classList.remove('hop');
            void lane.swimmer.offsetWidth;
            lane.swimmer.classList.add('hop');
            const plus = document.createElement('span');
            plus.className = 'plus';
            plus.textContent = '+' + gained;
            lane.swimmer.append(plus);
            setTimeout(() => plus.remove(), 1500);
        }

        function render(data) {
            const total = data.totalVotes;
            const max = Math.max(0, ...data.results.map(r => r.count));

            for (const item of data.results) {
                const lane = laneFor(item);
                const share = total > 0 ? item.count / total : 0;
                lane.track.style.setProperty('--p', share);
                lane.count.innerHTML = '';
                lane.count.append(item.count);
                const pct = document.createElement('small');
                pct.textContent = Math.round(share * 100) + '%';
                lane.count.append(pct);
                lane.li.classList.toggle('lead', max > 0 && item.count === max);
                if (lane.last !== null && item.count > lane.last) {
                    celebrate(lane, item.count - lane.last);
                }
                lane.last = item.count;
            }

            totalEl.querySelector('strong').textContent = total;
            totalEl.lastChild.textContent = total === 1 ? ' vote so far' : ' votes so far';
            if (lastTotal !== null && total !== lastTotal) {
                totalEl.classList.remove('bump');
                void totalEl.offsetWidth;
                totalEl.classList.add('bump');
            }
            lastTotal = total;
        }

        async function fetchResults() {
            try {
                const res = await fetch('/api/results');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                render(await res.json());
            } catch (e) {
                console.error('Failed to fetch results', e);
            }
        }

        // Initial fetch + poll every 3 seconds
        fetchResults();
        setInterval(fetchResults, 3000);
    </script>

</body>
</html>
