name: Promote Application
on:
  workflow_dispatch:
    inputs:
      source_env:
        description: 'Source Environment'
        required: true
        default: 'staging'
        type: string
      target_env:
        description: 'Target Environment'
        required: true
        default: 'devex'
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Promote Application
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Request Promotion
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          APP_NAME: ${{ github.event.repository.name }}
          SOURCE_ENV: ${{ inputs.source_env }}
          TARGET_ENV: ${{ inputs.target_env }}
        run: |
          set -euo pipefail
          jq -n \
            --arg app_name "${APP_NAME}" \
            --arg source_env "${SOURCE_ENV}" \
            --arg target_env "${TARGET_ENV}" \
            '{event_type: "app-promotion", client_payload: {app_name: $app_name, source_env: $source_env, target_env: $target_env}}' \
            | gh api --method POST repos/thomasvitale/kubecon-eu-2026-gitops/dispatches --input -
