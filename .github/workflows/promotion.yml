name: Promote Application
on:
  workflow_dispatch:
    inputs:
      source_env:
        description: 'Source Environment'
        required: true
        default: 'cloud'
        type: choice
        options:
          - cloud
          - prod
      target_env:
        description: 'Target Environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - cloud
          - prod

env:
  DEPLOY_REPO: kubecon-eu-2026-gitops

permissions:
  contents: read

concurrency: promotion

jobs:
  promote:
    name: Promote Application
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Request Promotion
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          APP_NAME: ${{ github.event.repository.name }}
          SOURCE_ENV: ${{ inputs.source_env }}
          TARGET_ENV: ${{ inputs.target_env }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "${SOURCE_ENV}" = "${TARGET_ENV}" ]; then
            echo "::error::Source and target environments must differ"
            exit 1
          fi
          jq -n \
            --arg app_name "${APP_NAME}" \
            --arg source_env "${SOURCE_ENV}" \
            --arg target_env "${TARGET_ENV}" \
            '{event_type: "app-promotion", client_payload: {app_name: $app_name, source_env: $source_env, target_env: $target_env}}' \
            | gh api --method POST "repos/${OWNER}/${DEPLOY_REPO}/dispatches" --input -
