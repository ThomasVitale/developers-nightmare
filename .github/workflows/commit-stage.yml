name: Commit Stage

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.sdkmanrc'
      - '*.adoc'
      - '*.png'
      - '*.md'
      - '*.txt'
      - 'catalog-info.yaml'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'
      - '.github/*.yml'
      - '.github/*.yaml'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE: thomasvitale/developers-nightmare
  VERSION: ${{ github.sha }}
  DEPENDENCY_TRACK_PARENT: Developers Nightmare

permissions:
  contents: read

concurrency:
  group: commit-stage-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: ./.github/actions/setup-devenv

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Compile and test
        shell: devenv shell bash -- -e {0}
        run: task build

      - name: Publish SBOM
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          DEPENDENCY_TRACK_HOSTNAME: ${{ secrets.DEPENDENCY_TRACK_HOSTNAME }}
          DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          PROJECT_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST "https://${DEPENDENCY_TRACK_HOSTNAME}/api/v1/bom" \
            -H "X-Api-Key: ${DEPENDENCY_TRACK_API_KEY}" \
            -F "projectName=${PROJECT_NAME}" \
            -F "projectVersion=${PROJECT_VERSION}" \
            -F "projectTags=java,spring-boot" \
            -F "parentName=${DEPENDENCY_TRACK_PARENT}" \
            -F "autoCreate=true" \
            -F "bom=@build/reports/cyclonedx/application.cdx.json"

  package-platform:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: [build]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: ./.github/actions/setup-devenv

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Log into container registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish ${{ matrix.arch }} OCI image
        shell: devenv shell bash -- -e {0}
        run: task image:build:arch ARCH="${{ matrix.arch }}" VERSION="${VERSION}"

      - name: Read image digest
        shell: devenv shell bash -- -e {0}
        run: |
          set -euo pipefail
          IMAGE_DIGEST=$(task image:digest ARCH="${{ matrix.arch }}" VERSION="${VERSION}")
          echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "$GITHUB_ENV"

      - name: Generate OCI image SBOM
        shell: devenv shell bash -- -e {0}
        run: task image:sbom ARCH="${{ matrix.arch }}" VERSION="${VERSION}"

      - name: Attest OCI image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: build/reports/syft/image-${{ matrix.arch }}.cdx.json
          push-to-registry: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OCI image SBOM
        env:
          DEPENDENCY_TRACK_HOSTNAME: ${{ secrets.DEPENDENCY_TRACK_HOSTNAME }}
          DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          PROJECT_NAME: ${{ github.event.repository.name }}-image-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST "https://${DEPENDENCY_TRACK_HOSTNAME}/api/v1/bom" \
            -H "X-Api-Key: ${DEPENDENCY_TRACK_API_KEY}" \
            -F "projectName=${PROJECT_NAME}" \
            -F "projectVersion=main" \
            -F "projectTags=oci,buildpacks,${ARCH}" \
            -F "parentName=${DEPENDENCY_TRACK_PARENT}" \
            -F "autoCreate=true" \
            -F "bom=@build/reports/syft/image-${ARCH}.cdx.json"

  package:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Package
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [package-platform]
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: ./.github/actions/setup-devenv

      - name: Log into container registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish multi-arch OCI image
        shell: devenv shell bash -- -e {0}
        run: task image:build VERSION="${VERSION}"

      - name: Sign OCI image
        shell: devenv shell bash -- -e {0}
        run: task image:sign VERSION="${VERSION}"

      - name: Read image digest
        shell: devenv shell bash -- -e {0}
        run: |
          set -euo pipefail
          IMAGE_DIGEST=$(task image:digest VERSION="${VERSION}")
          echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "$GITHUB_ENV"

      - name: Attest OCI image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
