name: Deliver Application
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: 'The target environment for deployment'
      registry:
        required: true
        type: string
        description: 'The container registry URL'
      owner:
        required: true
        type: string
        description: 'The owner of the repositories'
      app_repo:
        required: true
        type: string
        description: 'The application repository name'
      deploy_repo:
        required: true
        type: string
        description: 'The deployment repository name'
      version:
        required: true
        type: string
        description: 'The version/tag of the application to deploy'
    secrets:
      dispatch_token:
        required: true
        description: 'Token for repository dispatch'

permissions:
  contents: read

jobs:
  deliver:
    name: Deliver release candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Deliver application
        env:
          GH_TOKEN: ${{ secrets.dispatch_token }}
          TARGET: ${{ inputs.target }}
          REGISTRY: ${{ inputs.registry }}
          OWNER: ${{ inputs.owner }}
          APP_REPO: ${{ inputs.app_repo }}
          DEPLOY_REPO: ${{ inputs.deploy_repo }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          jq -n \
            --arg app_target "${TARGET}" \
            --arg app_image "${REGISTRY}/${OWNER}/${APP_REPO}" \
            --arg app_name "${APP_REPO}" \
            --arg app_version "${VERSION}" \
            '{event_type: "app-delivery", client_payload: {app_target: $app_target, app_image: $app_image, app_name: $app_name, app_version: $app_version}}' \
            | gh api --method POST "repos/${OWNER}/${DEPLOY_REPO}/dispatches" --input -
